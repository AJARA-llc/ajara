<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..900&family=JetBrains+Mono:wght@700&family=Noto+Sans+JP:wght@700;900&display=block">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body { font-family: "Archivo", "Noto Sans JP", sans-serif; color: #111; background: #FAF7F8; overflow: hidden; position: relative; }
  .logo { position: absolute; left: 72px; top: 54px; font-weight: 900; font-stretch: 125%; font-size: 34px; line-height: .88; letter-spacing: -0.01em; }
  .logo i { font-style: normal; color: #B9E800; }
  .copy { position: absolute; left: 72px; top: 176px; width: 720px; z-index: 2; }
  .tag { display: inline-block; transform: rotate(-1deg); background: #D2FB2E; border-radius: 4px; padding: 7px 18px; font-family: "JetBrains Mono", "Noto Sans JP", monospace; font-weight: 700; font-size: 22px; margin-bottom: 26px; }
  h1 { font-weight: 900; line-height: 1.16; letter-spacing: -0.01em; }
  h1.en { font-stretch: 125%; font-size: 104px; line-height: .9; letter-spacing: -0.035em; text-transform: uppercase; }
  h1.ja { font-size: 74px; }
  .hl { position: relative; display: inline-block; z-index: 0; padding: 0 .1em; }
  .hl::before { content: ""; position: absolute; inset: .08em -.06em 0; background: #D2FB2E; transform: skewX(-8deg); z-index: -1; }
  h1.en .hl { font-style: italic; transform: rotate(-4deg); padding-top: .08em; }
  .sub { margin-top: 26px; font-weight: 900; font-size: 34px; }
  .cta { position: absolute; left: 72px; bottom: 54px; z-index: 2; font-weight: 900; font-size: 28px; color: #fff; background: #111; padding: 16px 34px; border-radius: 999px; }
  .art { position: absolute; right: 24px; bottom: 30px; width: 470px; filter: drop-shadow(0 24px 30px rgba(107,63,224,.22)); }
  .burst { position: absolute; right: -40px; top: -60px; width: 250px; }
  .band { position: absolute; left: -20px; right: -20px; bottom: -34px; height: 62px; background: #D2FB2E; transform: rotate(-1.8deg); }
</style>
</head>
<body>
  <div class="band"></div>
  <svg class="burst" viewBox="0 0 200 200"><path fill="#D2FB2E" d="M100 0l14 30 27-19 1 33 32-7-12 31 33 7-24 22 28 18-31 11 18 28-33-2 5 33-30-14-10 32-18-28-18 28-10-32-30 14 5-33-33 2 18-28-31-11 28-18-24-22 33-7-12-31 32 7 1-33 27 19z"/></svg>
  <div class="logo">AJARA<br>STUDIO<i>.</i></div>
  <div class="copy">
    <span class="tag" id="tag"></span>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="cta">30分の無料相談 受付中 ↗</div>
  <img class="art" src="../public/images/studio/hero-a.webp" alt="">
<script>
  // title: array of lines; each line is an array of [text, highlighted?]
  const variants = {
    top: { tag: "AI DEVELOPMENT STUDIO", lang: "en", title: [[["Build Your"]], [["Future.", true]]], sub: "AIで、アイデアを現実に。" },
    school: { tag: "AIアプリ開発スクール", lang: "ja", title: [[["AIアプリ"]], [["開発者", true], ["になろう。"]]], sub: "" },
    coaching: { tag: "アプリ開発コーチング", lang: "ja", title: [[["そのアイデア、"]], [["リリース", true], ["まで一緒に。"]]], sub: "" },
  };
  const v = variants[new URLSearchParams(location.search).get("v") || "top"];
  document.getElementById("tag").textContent = "</ " + v.tag + " >";
  document.getElementById("sub").textContent = v.sub;
  const title = document.getElementById("title");
  title.className = v.lang;
  v.title.forEach((line, i) => {
    if (i) title.appendChild(document.createElement("br"));
    line.forEach(([text, hl]) => {
      const span = document.createElement("span");
      if (hl) span.className = "hl";
      span.textContent = text;
      title.appendChild(span);
    });
  });
</script>
</body>
</html>
