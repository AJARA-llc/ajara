<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=block">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: "Zen Maru Gothic", sans-serif; color: #2E0A72; overflow: hidden; position: relative;
    background: linear-gradient(120deg, #F1E8FF 0%, #F8E6F6 55%, #FFEBDD 100%);
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(50px); }
  .b1 { width: 420px; height: 420px; left: -120px; top: -140px; background: rgba(255,255,255,.75); }
  .b2 { width: 380px; height: 380px; right: 120px; top: 120px; background: rgba(214,190,255,.65); }
  .b3 { width: 520px; height: 260px; right: -120px; bottom: -120px; background: rgba(255,255,255,.7); }
  .logo { position: absolute; left: 72px; top: 60px; height: 52px; }
  .copy { position: absolute; left: 72px; top: 150px; width: 640px; z-index: 2; }
  .eyebrow { display: inline-block; font-weight: 700; font-size: 24px; color: #fff; padding: 8px 22px; border-radius: 999px; margin-bottom: 22px; }
  h1 { font-weight: 900; font-size: 70px; line-height: 1.24; letter-spacing: -0.01em; }
  .hl { position: relative; white-space: nowrap; z-index: 0; }
  .hl::after { content: ""; position: absolute; left: 0; right: 0; bottom: 2px; height: 14px; background: #FFC83D; border-radius: 8px; z-index: -1; opacity: .9; }
  .cta { position: absolute; left: 72px; bottom: 58px; display: flex; align-items: center; gap: 14px; z-index: 2;
    font-weight: 900; font-size: 30px; color: #fff; padding: 18px 34px; border-radius: 999px;
    background: linear-gradient(90deg, #FF7A1F, #FFA24A); box-shadow: 0 14px 30px -12px rgba(255,122,31,.8); }
  .art { position: absolute; right: 30px; bottom: 0; }
  .icon { position: absolute; filter: drop-shadow(0 10px 18px rgba(46,10,114,.18)); }
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <img class="logo" src="../public/images/studio/logo.png" alt="">
  <div class="copy">
    <span class="eyebrow" id="eyebrow"></span>
    <h1 id="title"></h1>
  </div>
  <div class="cta">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
    30分の無料相談 受付中
  </div>
  <div id="art"></div>
<script>
  const IMG = "../public/images/studio/";
  // title: array of lines; each line is an array of [text, highlighted?]
  const variants = {
    top: {
      eyebrow: "AIアプリ開発スクール ／ アプリ開発コーチング", color: "#8B4CF6",
      title: [[["そのアイデア、"]], [["一緒に"], ["アプリ", true], ["に"]], [["しよう。"]]],
      art: [
        { src: "hero-girl.webp", cls: "art", style: "height:560px" },
        { src: "icon-rocket.webp", cls: "icon", style: "width:150px;right:40px;top:40px" },
        { src: "icon-bulb.webp", cls: "icon", style: "width:110px;right:470px;top:60px" },
      ],
    },
    school: {
      eyebrow: "AIアプリ開発スクール", color: "#8B4CF6",
      title: [[["AIで、"]], [["アプリ開発者", true], ["に"]], [["なろう。"]]],
      art: [
        { src: "hero-girl.webp", cls: "art", style: "height:540px" },
        { src: "icon-laptop.webp", cls: "icon", style: "width:150px;right:470px;top:56px" },
      ],
    },
    coaching: {
      eyebrow: "アプリ開発コーチング", color: "#FF7A1F",
      title: [[["そのアイデア、"]], [["リリース", true], ["まで"]], [["一緒に。"]]],
      art: [
        { src: "cta-boy.webp", cls: "art", style: "height:540px" },
        { src: "icon-phone.webp", cls: "icon", style: "width:100px;right:560px;top:60px" },
        { src: "icon-rocket.webp", cls: "icon", style: "width:130px;right:420px;top:28px" },
      ],
    },
  };
  const v = variants[new URLSearchParams(location.search).get("v") || "top"];
  const eyebrow = document.getElementById("eyebrow");
  eyebrow.textContent = v.eyebrow;
  eyebrow.style.background = v.color;
  const title = document.getElementById("title");
  v.title.forEach((line, i) => {
    if (i) title.appendChild(document.createElement("br"));
    line.forEach(([text, hl]) => {
      const span = document.createElement("span");
      if (hl) span.className = "hl";
      span.textContent = text;
      title.appendChild(span);
    });
  });
  const art = document.getElementById("art");
  v.art.forEach(({ src, cls, style }) => {
    const img = document.createElement("img");
    img.src = IMG + src;
    img.className = cls;
    img.style.cssText = style;
    art.appendChild(img);
  });
</script>
</body>
</html>
