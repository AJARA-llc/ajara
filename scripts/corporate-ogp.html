<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;700&family=Noto+Sans+JP:wght@500;700&display=block">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: "Noto Sans JP", sans-serif; color: #F8FAFC; overflow: hidden; position: relative;
    background: radial-gradient(circle at 85% 20%, rgba(232,96,10,.22), transparent 45%),
                radial-gradient(circle at 10% 110%, rgba(232,96,10,.12), transparent 40%),
                linear-gradient(135deg, #020617 0%, #0F172A 60%, #111a33 100%);
  }
  .grid { position: absolute; inset: 0; opacity: .07;
    background-image: linear-gradient(#94A3B8 1px, transparent 1px), linear-gradient(90deg, #94A3B8 1px, transparent 1px);
    background-size: 48px 48px; }
  .copy { position: absolute; left: 80px; top: 92px; width: 640px; }
  .label { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 22px; letter-spacing: .08em;
    color: #F07A2A; border: 1.5px solid rgba(232,96,10,.45); padding: 8px 20px; border-radius: 999px; margin-bottom: 30px; }
  .label::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #E8600A; }
  h1 { font-family: "Noto Serif JP", serif; font-weight: 700; font-size: 62px; line-height: 1.35; }
  .hl { color: #F07A2A; }
  .sub { margin-top: 28px; font-size: 24px; line-height: 1.6; color: #CBD5E1; font-weight: 500; }
  .foot { position: absolute; left: 80px; bottom: 54px; display: flex; align-items: center; gap: 18px; font-size: 22px; color: #94A3B8; letter-spacing: .04em; }
  .foot b { color: #F8FAFC; font-weight: 700; letter-spacing: .12em; }
  .foot b span { color: #E8600A; }
  .card { position: absolute; right: 80px; top: 50%; transform: translateY(-50%); width: 340px; height: 340px; border-radius: 32px;
    overflow: hidden; display: grid; place-items: center; box-shadow: 0 30px 60px -20px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08); }
  .card img { display: block; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: linear-gradient(90deg, #E8600A, #F07A2A 60%, transparent); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="copy">
    <span class="label" id="label"></span>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="foot"><b>AJ<span>A</span>RA</b><span>合同会社AJARA ・ ajara.co.jp</span></div>
  <div class="card" id="card"></div>
  <div class="bar"></div>
<script>
  const IMG = "../public/images/";
  // title: lines of [text, highlighted?] segments
  const variants = {
    home: {
      label: "合同会社AJARA",
      title: [[["AIで、"]], [["ビジネスの次の一手", true]], [["を共創する。"]]],
      sub: "AIO・法人研修・hintl・AI映像制作・AJARA Studio",
      card: { src: "logo-full.png", bg: "#F5F1E8", style: "width:100%;height:100%;object-fit:cover" },
    },
    aioru: {
      label: "AIOコンサルティング aioru",
      title: [[["AI検索で、"]], [["選ばれる企業", true], ["へ。"]]],
      sub: "ChatGPT・Perplexity・Gemini に\n引用される企業づくりを伴走します。",
      card: { src: "aioru-logo-horizontal.png", bg: "#FFFFFF", style: "width:84%" },
    },
    hintl: {
      label: "hintl",
      title: [[["広告ではなく、"]], [["研究", true], ["で選ぶ。"]]],
      sub: "健康・美容の選択肢を公開研究から比較。\nエビデンスを100点満点で可視化する無料診断。",
      card: { src: "hintl-logo.png", bg: "#FFFFFF", style: "width:auto;height:230px" },
    },
    reskilling: {
      label: "法人研修・リスキリング",
      title: [[["総務・事務職の"]], [["実務力", true], ["を伸ばす。"]]],
      sub: "12時間 eラーニング 4コース。\n人材開発支援助成金の対象要件を満たす設計。",
      card: { src: "logo-full.png", bg: "#F5F1E8", style: "width:100%;height:100%;object-fit:cover" },
    },
    creative: {
      label: "AI映像制作 AJARA Creative",
      title: [[["生成AIで、"]], [["ブランドを映像", true], ["に。"]]],
      sub: "ブランドCM・ショート動画を\n素材ゼロから最短1週間で。",
      card: { src: "logo-full.png", bg: "#F5F1E8", style: "width:100%;height:100%;object-fit:cover" },
    },
  };
  const v = variants[new URLSearchParams(location.search).get("v") || "home"];
  document.getElementById("label").textContent = v.label;
  const title = document.getElementById("title");
  v.title.forEach((line, i) => {
    if (i) title.appendChild(document.createElement("br"));
    line.forEach(([text, hl]) => {
      const span = document.createElement("span");
      if (hl) span.className = "hl";
      span.textContent = text;
      title.appendChild(span);
    });
  });
  const sub = document.getElementById("sub");
  v.sub.split("\n").forEach((line, i) => {
    if (i) sub.appendChild(document.createElement("br"));
    sub.appendChild(document.createTextNode(line));
  });
  const card = document.getElementById("card");
  card.style.background = v.card.bg;
  const img = document.createElement("img");
  img.src = IMG + v.card.src;
  img.style.cssText = v.card.style;
  card.appendChild(img);
</script>
</body>
</html>
